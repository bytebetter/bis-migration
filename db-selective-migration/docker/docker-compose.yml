# PostgreSQL 16 + Directus 11 + BIS Backoffice (Next.js)
#
# From db-selective-migration/:
#   cp docker/postgres.env.example .env.postgres
#   cp docker/directus.env.example .env.directus
#   cp docker/backoffice.env.example .env.backoffice
#   docker compose --env-file .env.postgres --env-file .env.directus --env-file .env.backoffice \
#     -f docker/docker-compose.yml up -d
#
# URLs (localhost): Backoffice http://127.0.0.1:3000  |  Directus http://127.0.0.1:8055
#
# Production extension deploy: set DIRECTUS_EXTENSIONS_DIR=/opt/bis/directus-extensions
# and use docker/deploy-extension.sh (see docker/EXTENSION_DEPLOY.md)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bisinfo}
    volumes:
      - bis_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - bis_redis_data:/data
    # Internal only — Directus reaches redis:6379 on the compose network
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DIRECTUS_PORT:-8055}:8055"
    volumes:
      - directus_uploads:/directus/uploads
      - ${DIRECTUS_EXTENSIONS_DIR:-../directus-extensions-bb-dev}:/directus/extensions:ro
      - ${SMB_SHARE_MOUNT:-/mnt/bis-shared}:/data/shared
    environment:
      KEY: ${KEY:?set KEY in .env.directus}
      SECRET: ${SECRET:?set SECRET in .env.directus}
      DB_CLIENT: ${DB_CLIENT:-pg}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-${POSTGRES_DB:-bisinfo}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-bis}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:?set DB_PASSWORD or POSTGRES_PASSWORD}}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.directus}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8055}
      WEBSOCKETS_ENABLED: ${WEBSOCKETS_ENABLED:-true}
      CORS_ENABLED: ${CORS_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:3000,http://localhost:3000}
      CORS_METHODS: ${CORS_METHODS:-*}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-*}
      # Redis cache (service name `redis` on the compose network)
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_STORE: ${CACHE_STORE:-redis}
      CACHE_AUTO_PURGE: ${CACHE_AUTO_PURGE:-true}
      REDIS: ${REDIS:-redis://redis:6379}

  backoffice:
    image: ${BACKOFFICE_IMAGE:-bytebetter/bis-backoffice:v1.0.2}
    restart: unless-stopped
    depends_on:
      - directus
    ports:
      - "127.0.0.1:${BACKOFFICE_PORT:-3000}:3000"

  shared-probe:
    image: python:3.12-alpine
    restart: unless-stopped
    volumes:
      - ${SMB_SHARE_MOUNT:-/mnt/bis-shared}:/data/shared
      - ./shared-probe.py:/app/shared-probe.py:ro
    working_dir: /app
    command: ["python", "shared-probe.py"]
    expose:
      - "8081"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  bis_pgdata:
  bis_redis_data:
  directus_uploads:
  uptime_kuma_data:
